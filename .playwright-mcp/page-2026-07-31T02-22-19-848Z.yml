        - heading "Know How Your Operation Should Be Performing" [level=2] [ref=e70]: Know How Your OperationShould Be Performing
        - paragraph [ref=e71]: Complex operations generate immense amounts of information, but individual systems only explain what is happening within their own area. They cannot determine whether the operation as a whole is performing as intended.
        - paragraph [ref=e72]: Atlas establishes an operational model based on expected conditions, critical relationships, risk controls, performance requirements and operational objectives. This creates a reference for how the operation should perform safely, efficiently and productively.
        - paragraph [ref=e73]: As live conditions change, Atlas compares actual performance against the model to detect deviations, understand their wider impact, predict likely consequences and recommend or automate corrective action.
