        - paragraph [ref=e34]: Operational Intelligence
        - heading "Each System Sees Something. Atlas Sees the Whole Operation." [level=1] [ref=e35]: Each System Sees Something.Atlas Sees the Whole Operation.
        - paragraph [ref=e36]: Modern operations rely on dozens of specialised systems, each providing only part of the operational picture. Atlas brings this information together to help teams understand what is happening, identify emerging risks and act with confidence.
