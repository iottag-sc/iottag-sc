          - paragraph [ref=e75]: A single operational picture can be viewed through the priorities, systems and risks that matter most to each team.
        - generic [ref=e76]:
          - paragraph [ref=e77]: Atlas organises information from across the site into a connected operational environment. Teams can move between workforce, fleet, equipment, environmental, production, safety and automation views while retaining the context of the wider operation.
          - paragraph [ref=e78]: This makes it possible to investigate a specific operational area without losing sight of the people, assets, conditions and dependencies surrounding it. Instead of moving between disconnected platforms, teams can explore how each part of the operation contributes to safety, productivity, reliability and performance. The result is not simply more data in one place.
          - paragraph [ref=e79]: It is a structured way to examine the operation from multiple perspectives while maintaining one consistent source of operational truth.
