      - generic [ref=e137]:
        - heading "Connected Insight" [level=3] [ref=e138]
        - paragraph [ref=e139]: Atlas does not simply report individual events. It reveals how changing conditions influence the wider operation, helping teams assess risk, coordinate a response and act before impacts escalate.
    - generic [ref=e140]:
      - generic [ref=e141]:
        - generic [ref=e142]:
          - generic [ref=e143]:
            - heading "Turn Complex Conditions Into Clear Decisions" [level=2] [ref=e144]
            - paragraph [ref=e145]: Modern operations generate thousands of events, alerts and changing conditions every day. The challenge is identifying which developments matter, how they are connected and where intervention is required.
          - generic [ref=e146]:
            - paragraph [ref=e147]: Atlas evaluates information across people, equipment, environmental conditions, production activity and site systems to create a concise view of the issue and its likely operational significance.
            - paragraph [ref=e148]: Rather than presenting decision-makers with a collection of disconnected alerts, Atlas helps explain what has changed, why it matters, which areas are affected, what conditions are contributing and where action should be focused.
            - paragraph [ref=e149]: This allows operators, supervisors, managers and executives to assess developing situations more quickly, apply specialist knowledge more effectively and coordinate action with greater confidence.
        - generic [ref=e150]:
          - generic [ref=e151]: What is happening?
          - generic [ref=e153]: Why does it matter?
          - generic [ref=e155]: Who and what may be affected?
          - generic [ref=e157]: What conditions are contributing?
          - generic [ref=e159]: Where should attention be focused?
        - paragraph [ref=e161]: This helps operational teams, supervisors, management and executive stakeholders quickly understand changing conditions without requiring specialist interpretation.
      - generic [ref=e162]:
        - generic [ref=e163]:
          - paragraph [ref=e164]: Example Intelligence Summary
          - heading "Ventilation Failure — Zone 4" [level=3] [ref=e165]
          - paragraph [ref=e166]: "- The primary ventilation system in Zone 4 has stopped operating.- Airflow has reduced across the affected area.- Environmental sensors indicate increasing temperature and gas concentrations downstream.- Twenty-three personnel remain within connected work areas.- Vehicle activity is continuing through adjacent haul routes.- Current conditions indicate increasing workforce exposure and potential production disruption if ventilation is not restored."
        - generic [ref=e170]:
          - heading "Recommended Response" [level=3] [ref=e171]
          - paragraph [ref=e172]: "- Dispatch maintenance personnel to inspect the ventilation system.- Notify supervisors responsible for Zone 4 and connected downstream areas.- Review current workforce locations and adjust deployment where required.- Restrict access to affected areas until environmental conditions stabilise.- Monitor gas, temperature and airflow conditions during the response.- Escalate the event if environmental thresholds continue to deteriorate."
    - generic [ref=e173]:
      - generic [ref=e174]:
        - generic [ref=e175]:
          - heading "One Source Of Intelligence. Better Decisions At Every Level." [level=2] [ref=e176]: One Source Of Intelligence.Better Decisions At Every Level.
          - paragraph [ref=e177]: Atlas creates a consistent foundation for decision-making across the organisation while presenting each team with the information, priorities and level of detail relevant to its role.
          - paragraph [ref=e178]: Frontline teams need immediate visibility of active conditions and emerging risks. Supervisors need to coordinate people, equipment and work areas. Managers need to understand performance, exceptions and developing constraints. Executives and asset owners require a broader view of risk, production, reliability and portfolio performance.
          - paragraph [ref=e179]: Atlas supports each of these requirements through role-relevant dashboards and operational summaries built from the same connected information. This helps reduce conflicting interpretations, improves coordination between teams and creates greater confidence in decisions made across the organisation.
