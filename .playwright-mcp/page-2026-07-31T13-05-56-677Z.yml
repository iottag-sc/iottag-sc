    - generic [ref=e109]:
      - generic [ref=e110]:
        - generic [ref=e111]:
          - heading "Understand How One Change Affects The Wider Operation" [level=2] [ref=e112]
          - paragraph [ref=e113]: Operational events rarely occur in isolation. A change in one system can influence people, equipment, environmental conditions, production and risk.
        - generic [ref=e114]:
          - paragraph [ref=e115]: "Traditional monitoring systems typically report each event separately: a fan has stopped, airflow has reduced, temperature has increased or gas levels have changed. Each alert may be accurate, but none explains the full operational consequence on its own."
          - paragraph [ref=e116]: Atlas analyses these events in context. It connects the initial condition with the systems, areas and people that may be affected, helping teams understand how an operational issue is developing across the site.
          - paragraph [ref=e117]: This allows decision-makers to move beyond isolated alarms and assess the wider cause, consequence and potential exposure before the situation becomes more difficult to control.
      - generic [ref=e118]:
