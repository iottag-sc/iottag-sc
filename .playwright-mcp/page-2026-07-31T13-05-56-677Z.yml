        - generic [ref=e42]:
          - heading "Every System Contributes Part Of The Picture" [level=2] [ref=e43]
          - paragraph [ref=e44]: Operations already rely on specialised systems to monitor people, vehicles, assets, environmental conditions and production activity.
        - generic [ref=e45]:
          - paragraph [ref=e46]: Each system answers a specific operational question. Workforce systems show who is onsite and where they are located.
          - paragraph [ref=e47]: Fleet systems monitor vehicle movement and traffic conditions. Asset platforms track equipment performance, while environmental and production systems report on changing site conditions and operational output.
          - paragraph [ref=e48]: Individually, these systems provide valuable visibility. The challenge is that their information is often viewed separately, making it difficult to understand how changes in one area may affect another.
          - paragraph [ref=e49]: Atlas brings these information sources together so teams can assess the operation as a connected whole rather than as a collection of isolated systems.
      - generic [ref=e50]:
